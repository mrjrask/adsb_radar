[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adsb-radar"
version = "0.1.0"
description = "Standalone Raspberry Pi HDMI flight board and radar"
requires-python = ">=3.11"
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["adsb_radar*"]

[tool.setuptools.package-data]
adsb_radar = ["static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.per-file-ignores]
# Original pure rendering helpers retain their upstream zip semantics.
"adsb_radar/flight_routes.py" = ["B905"]
